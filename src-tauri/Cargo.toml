[package]
name = "audio-graph"
version = "1.0.0"
description = "Audio Graph: маршрутизация звука графом"
edition = "2021"

[lib]
# суффикс _lib нужен, чтобы имя библиотеки не конфликтовало с бинарником на Windows
name = "audio_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Registry", "Win32_Globalization"] }
windows-core = "0.62.2"
